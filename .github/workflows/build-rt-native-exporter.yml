name: Build RTNativeExporter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone UE4SS with Epic-access token and patch submodules
        shell: bash
        env:
          EPIC_GITHUB_TOKEN: ${{ secrets.EPIC_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${EPIC_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${EPIC_GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${EPIC_GITHUB_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

          cd cpp-mods
          git clone https://github.com/UE4SS-RE/RE-UE4SS.git
          cd RE-UE4SS

          sed -i 's#git@github.com:#https://x-access-token:'"${EPIC_GITHUB_TOKEN}"'@github.com/#g' .gitmodules
          sed -i 's#ssh://git@github.com/#https://x-access-token:'"${EPIC_GITHUB_TOKEN}"'@github.com/#g' .gitmodules

          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Configure
        run: |
          cd cpp-mods
          cmake -B build -S . -G "Visual Studio 17 2022"

      - name: Inspect generated Visual Studio solution
        shell: pwsh
        run: |
          cd cpp-mods/build
          Write-Host "PWD:"
          Get-Location
          Write-Host "Top-level files:"
          Get-ChildItem | Select-Object Name,FullName
          Write-Host "All SLN:"
          Get-ChildItem -Recurse -Filter *.sln | Select-Object FullName
          Write-Host "RTNativeExporter vcxproj:"
          Get-ChildItem -Recurse -Filter RTNativeExporter.vcxproj | Select-Object FullName
          Write-Host "ZERO_CHECK vcxproj:"
          Get-ChildItem -Recurse -Filter ZERO_CHECK.vcxproj | Select-Object FullName
          Write-Host "RTNativeExporter project configs:"
          $p = Get-ChildItem -Recurse -Filter RTNativeExporter.vcxproj | Select-Object -First 1
          if ($p) { Select-String -Path $p.FullName -Pattern "ProjectConfiguration|ConfigurationType|PlatformToolset|OutDir|IntDir" -Context 0,3 }
          Write-Host "ZERO_CHECK project configs:"
          $z = Get-ChildItem -Recurse -Filter ZERO_CHECK.vcxproj | Select-Object -First 1
          if ($z) { Select-String -Path $z.FullName -Pattern "ProjectConfiguration|ConfigurationType|PlatformToolset|OutDir|IntDir" -Context 0,3 }

      - name: Build RTNativeExporter
        shell: pwsh
        run: |
          cd cpp-mods
          cmake --build build --target RTNativeExporter --verbose

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: RTNativeExporter
          path: cpp-mods/build/RTNativeExporter/Release/RTNativeExporter.dll
